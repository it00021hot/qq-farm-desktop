name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0); defaults to the triggering ref"
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26.x"
  WAILS_VERSION: "v3.0.0-beta.4"

jobs:
  windows:
    name: Build Windows (installer)
    runs-on: windows-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: qq-farm-desktop

      - name: Checkout qq-farm-web
        uses: actions/checkout@v4
        with:
          repository: it00021hot/qq-farm-web
          path: qq-farm-web

      - name: Checkout qq-farm-core
        uses: actions/checkout@v4
        with:
          repository: it00021hot/qq-farm-core
          path: qq-farm-core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: qq-farm-desktop/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: qq-farm-web/pnpm-lock.yaml

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Chocolatey's NSIS package can land in different layouts depending on
          # runner/choco state; locate makensis.exe and expose its dir on PATH.
          $makensis = Get-ChildItem -Path "C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $makensis) {
            $makensis = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\nsis" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $makensis) {
            throw "makensis.exe not found after choco install nsis"
          }
          Write-Host "makensis found at $($makensis.FullName)"
          "add-makensis-dir=$($makensis.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "$($makensis.DirectoryName)" >> $env:GITHUB_PATH
        id: nsis

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER"

      - name: Build installer
        shell: bash
        working-directory: qq-farm-desktop
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          if [[ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            export PATH="/c/Program Files (x86)/NSIS:$PATH"
          fi
          bash scripts/build-windows-installer.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: qq-farm-desktop/bin/qq-farm-windows-amd64-installer.exe
          if-no-files-found: error

  macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64 # Intel
          - arch: arm64 # Apple Silicon
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: qq-farm-desktop

      - name: Checkout qq-farm-web
        uses: actions/checkout@v4
        with:
          repository: it00021hot/qq-farm-web
          path: qq-farm-web

      - name: Checkout qq-farm-core
        uses: actions/checkout@v4
        with:
          repository: it00021hot/qq-farm-core
          path: qq-farm-core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: qq-farm-desktop/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: qq-farm-web/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER"

      - name: Build DMG + update zip
        working-directory: qq-farm-desktop
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/build-macos-release.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            qq-farm-desktop/bin/qq-farm-darwin-${{ matrix.arch }}.zip
            qq-farm-desktop/bin/qq-farm-darwin-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${REF#v}"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64
          path: dist

      - name: Download macOS artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum \
            qq-farm-windows-amd64-installer.exe \
            qq-farm-darwin-amd64.zip \
            qq-farm-darwin-amd64.dmg \
            qq-farm-darwin-arm64.zip \
            qq-farm-darwin-arm64.dmg \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: QQ Farm Desktop ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/qq-farm-windows-amd64-installer.exe
            dist/qq-farm-darwin-amd64.zip
            dist/qq-farm-darwin-amd64.dmg
            dist/qq-farm-darwin-arm64.zip
            dist/qq-farm-darwin-arm64.dmg
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
